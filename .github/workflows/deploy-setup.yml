name: Deploy Modal setup helper

# Manual trigger only. Deploys the one-time auto-setup helper
# (server/setup_app.py) that deploys the karaoke server into a
# caller's own Modal account from their API token.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Modal CLI
        run: pip install "modal==1.6.2" fastapi httpx numpy
      - name: Deploy setup helper
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          cd server
          modal deploy setup_app.py::setup_app
      # The helper URL is NOT hardcoded here (it used to leak the
      # live URL into the repo). Set the repo variable
      # KARAOKE_SETUP_URL to your deployed helper URL, e.g.
      # https://<your-workspace>--karaoke-setup-api.us-east.modal.run
      # Without it, the smoke check is skipped (the deploy still
      # succeeds) and a warning is printed.
      - name: Smoke check helper health
        env:
          KARAOKE_SETUP_URL: ${{ vars.KARAOKE_SETUP_URL }}
        run: |
          if [ -z "$KARAOKE_SETUP_URL" ]; then
            echo "WARNING: vars.KARAOKE_SETUP_URL not set — skipping /health smoke check."
            exit 0
          fi
          echo "Waiting for setup helper /health..."
          ok=""
          for i in $(seq 1 40); do
            code=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 30 "$KARAOKE_SETUP_URL/health" || true)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 15
          done
          if [ -z "$ok" ]; then echo "SMOKE CHECK FAILED"; exit 1; fi
          echo "SMOKE CHECK PASSED:"
          curl -sL --max-time 30 "$KARAOKE_SETUP_URL/health"
