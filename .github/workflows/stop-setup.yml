name: Stop Modal setup helper

# Manual trigger only. Terminates all running containers for the
# karaoke-setup helper, so a later redeploy starts completely fresh
# containers (no stale code serving requests).
on:
  workflow_dispatch:

jobs:
  stop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Modal CLI
        run: pip install "modal==1.6.2"
      - name: Stop setup helper app
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal app stop karaoke-setup -y
